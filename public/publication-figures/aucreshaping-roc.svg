<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">AUCReshaping ROC operating-point visual</title>
  <desc id="desc">A clean diagram showing sensitivity gains at high specificity.</desc>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect x="70" y="56" width="820" height="420" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M150 420H805M150 420V112" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M154 414 C235 392 308 338 382 270 C470 189 585 134 780 118" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <path d="M154 414 C250 372 334 290 430 206 C520 128 635 92 780 84" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
  <rect x="608" y="122" width="178" height="250" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="634" y="162" fill="#1e3a8a" font-family="Inter, Arial" font-size="24" font-weight="700">High specificity</text>
  <text x="634" y="202" fill="#475569" font-family="Inter, Arial" font-size="18">target zone</text>
  <path d="M682 316v-86" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M682 230l-18 22M682 230l18 22" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="252" y="90" fill="#0f172a" font-family="Inter, Arial" font-size="34" font-weight="800">AUCReshaping</text>
  <text x="252" y="126" fill="#475569" font-family="Inter, Arial" font-size="20">boost sensitivity where false positives must stay low</text>
  <text x="368" y="468" fill="#475569" font-family="Inter, Arial" font-size="18">specificity</text>
  <text x="92" y="282" fill="#475569" font-family="Inter, Arial" font-size="18" transform="rotate(-90 92 282)">sensitivity</text>
</svg>
